<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrokBot Notch</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="notch-stage" class="notch-stage">
      <!-- Single U-shaped Black Notch Pouch (starts collapsed, expands downward on click or ⌥Space) -->
      <div id="notch-pouch" class="notch-pouch" data-expanded="false" data-call="idle" data-typing="false">
        <!-- Top-Flush Concave Notch Ears at y = 0 -->
        <svg class="notch-ear notch-ear-left" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M18 0H0C9.941 0 18 8.059 18 18V0Z" />
        </svg>
        <svg class="notch-ear notch-ear-right" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path d="M0 0H18C8.059 0 0 8.059 0 18V0Z" />
        </svg>

        <!-- SETTINGS SCREEN (replaces the expanded content while open) -->
        <div id="settings-view" class="settings-view">
          <div class="settings-header">
            <button id="settings-close-btn" class="corner-btn" type="button" aria-label="Back" title="Back">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.25 3.5 5.75 8l4.5 4.5" /></svg>
            </button>
            <span class="settings-title">Settings</span>
            <span class="settings-header-spacer"></span>
          </div>
          <div class="settings-group">
            <label class="settings-row">
              <span>Voice <small id="settings-bot-name"></small></span>
              <select id="settings-voice" class="settings-select"></select>
            </label>
            <div class="settings-row">
              <span>Speed</span>
              <div id="settings-speed" class="segmented">
                <button type="button" data-speed="0.85">Slow</button>
                <button type="button" data-speed="1">Normal</button>
                <button type="button" data-speed="1.2">Fast</button>
              </div>
            </div>
          </div>
          <div class="settings-group">
            <label class="settings-row"><span>Open on hover</span><input type="checkbox" class="switch" data-pref="hoverToOpen" /></label>
            <label class="settings-row"><span>Sounds</span><input type="checkbox" class="switch" data-pref="sounds" /></label>
            <label class="settings-row"><span>Show on all screens</span><input type="checkbox" class="switch" data-pref="showOnAllScreens" /></label>
          </div>
        </div>

        <!-- COLLAPSED BAR (visible when data-expanded="false") -->
        <button id="collapsed-bar" class="collapsed-bar" type="button" title="Expand GrokBot Notch (⌥Space)">
          <span id="collapsed-mark" class="collapsed-mark"></span>
          <span id="collapsed-name" class="collapsed-name">Chief</span>
          <span class="collapsed-waves" aria-hidden="true">
            <i></i><i></i><i></i><i></i>
          </span>
        </button>

        <!-- EXPANDED POUCH CONTENT (Bot -> Name -> < Audio Waves (Tap to Type) >) -->
        <div id="expanded-content" class="expanded-content">
          <!-- Top: Large Flat GrokBot Character (click to start/stop Voice Mode) -->
          <button
            id="bot-character-btn"
            class="bot-character-btn"
            type="button"
            title="Click to start / stop Voice Mode with this Bot"
          >
            <span id="bot-mark-mount" class="bot-mark-mount"></span>
            <span id="main-star-badge" class="main-star-badge" hidden>
              <svg viewBox="0 0 12 12" width="10" height="10" fill="#fff" aria-hidden="true">
                <path d="M6 1.2l1.35 2.9 3.15.38-2.34 2.14.63 3.12L6 8.18 3.21 9.74l.63-3.12L1.5 4.48l3.15-.38L6 1.2z" />
              </svg>
            </span>
          </button>

          <!-- Settings gear (top-left) opens the in-notch settings screen -->
          <button id="settings-btn" class="corner-btn settings-btn" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

          <!-- Mute toggle (only shown during a call) -->
          <button id="mute-btn" class="mute-btn" type="button" aria-label="Mute microphone" title="Mute microphone (⌘⇧M)" aria-pressed="false">
            <svg class="mic-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
            </svg>
            <svg class="mic-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 9.5V6a3 3 0 0 0-5.7-1.3M9 9v2a3 3 0 0 0 4.6 2.5M5 11a7 7 0 0 0 11.3 5.5M19 11a7 7 0 0 1-.6 2.8M12 18v3M3 3l18 18" />
            </svg>
          </button>

          <!-- Middle: Bot Name + Subtle Live Caption/Status -->
          <div class="bot-title-block">
            <span id="bot-name-label" class="bot-name-label">Chief</span>
            <span id="bot-status-caption" class="bot-status-caption" hidden></span>
          </div>

          <!-- Bottom Row: < (Last Bot) | Audio Waves (Tap to Type) | > (Next Bot) -->
          <div class="bottom-nav-row">
            <button id="prev-bot-btn" class="nav-chevron-btn" type="button" aria-label="Previous Bot" title="Previous Bot (←)">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.25 3.5 5.75 8l4.5 4.5" />
              </svg>
            </button>

            <!-- Center: Audio Waves (Tap to Type) OR Left-Aligned Inline Text Input -->
            <div class="center-wave-slot">
              <button
                id="audio-waves-btn"
                class="audio-waves-btn"
                type="button"
                title="Tap to type, or click Bot to talk with Voice Mode"
              >
                <div id="audio-waves-bars" class="audio-waves-bars">
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
              </button>

              <form id="type-form" class="type-form" autocomplete="off" hidden>
                <input
                  id="type-input"
                  class="type-input"
                  type="text"
                  placeholder="Message Chief…"
                  autocomplete="off"
                  autocorrect="off"
                  autocapitalize="off"
                  spellcheck="false"
                />
              </form>
            </div>

            <button id="next-bot-btn" class="nav-chevron-btn" type="button" aria-label="Next Bot" title="Next Bot (→)">
              <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5.75 3.5 10.25 8l-4.5 4.5" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
